[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "timeful-cli"
version = "0.2.0"
description = "Unofficial command-line client for Timeful events"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jay Park" }]
keywords = ["timeful", "scheduling", "availability", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://github.com/jaykbpark/timeful-cli"
Issues = "https://github.com/jaykbpark/timeful-cli/issues"

[project.scripts]
timeful = "timeful_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/timeful_cli"]
